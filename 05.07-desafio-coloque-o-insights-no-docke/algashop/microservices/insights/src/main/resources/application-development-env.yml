server.port: 8086

spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/insights/database?prefix=insights.secrets.datasource.
      - aws-parameterstore:/config/algashop/insights?prefix=insights.params
      - aws-parameterstore:/config/algashop/shared?prefix=shared.params
  cloud:
    aws:
      credentials:
        access-key: test
        secret-key: test
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
  datasource:
    url: ${insights.params.datasource.url}
    username: ${insights.secrets.datasource.username}
    password: ${insights.secrets.datasource.password}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${shared.params.auth-server-url}

eureka:
  client:
    serviceUrl:
      defaultZone: ${shared.params.service-registry-url}/eureka
  instance:
    instanceId: ${random.uuid}
    prefer-ip-address: true
